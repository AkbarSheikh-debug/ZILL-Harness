[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zill-harness"
version = "0.1.0"
description = "ZILL: a concise coding-agent harness built with less code. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Akbar Sheikh" }]
keywords = ["agent", "llm", "coding-agent", "harness", "cli", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
zill = "zill.cli:main"

[project.urls]
Homepage = "https://github.com/AkbarSheikh-debug/ZILL-Harness"
Issues = "https://github.com/AkbarSheikh-debug/ZILL-Harness/issues"
Changelog = "https://github.com/AkbarSheikh-debug/ZILL-Harness/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["zill"]
