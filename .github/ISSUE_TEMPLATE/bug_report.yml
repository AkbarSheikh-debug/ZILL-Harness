name: Bug report
description: Something in ZILL doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste API keys.** Remove them from any logs or session files before attaching them."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. zill -p "..." -d ./project
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ZILL version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python version, model
      placeholder: Windows 11, Python 3.12, gemini:gemini-3.6-flash
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
