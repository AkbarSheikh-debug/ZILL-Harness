name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds ZILL and uploads it to PyPI
# with trusted publishing: no API token is stored anywhere.
# One-time setup on pypi.org: add a trusted publisher for this repository
# (workflow: release.yml, environment: pypi).

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import zill; print(zill.__version__)")
          test "v$version" = "$TAG" || { echo "tag $TAG does not match v$version"; exit 1; }
      - name: Test
        run: python -m unittest discover
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
