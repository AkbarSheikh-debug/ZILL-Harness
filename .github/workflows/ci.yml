name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Compile
        run: python -m compileall -q zill
      - name: Tests (offline, no API key)
        run: python -m unittest discover -v
      - name: CLI smoke test
        shell: bash
        run: |
          zill --help
          python -c "import zill; print(zill.__all__)"
          zill inspect --json > inspect.json
          zill doctor --json > doctor.json || true   # no API key in CI: the model check fails
          python -c "import json; json.load(open('inspect.json')); d = json.load(open('doctor.json')); print('doctor ok:', d['ok'])"

  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce zero dependencies and the core line budget
        run: |
          python - <<'EOF'
          import pathlib, sys, tomllib
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          def count(paths):
              return sum(len(p.read_text(encoding="utf-8").splitlines()) for p in paths)
          edges = {"mcp", "plugins"}
          files = list(pathlib.Path("zill").rglob("*.py"))
          core = count(p for p in files if not edges & set(p.parts))
          edge = count(p for p in files if edges & set(p.parts))
          print(f"runtime dependencies: {deps or 'none'}")
          print(f"core lines: {core} / 3500   edge lines: {edge} / 1500")
          if deps:
              sys.exit("ZILL must have zero runtime dependencies")
          if core > 3500:
              sys.exit("core is over the 3500-line budget; make it smaller")
          if edge > 1500:
              sys.exit("edge packages are over the 1500-line budget; make them smaller")
          EOF
